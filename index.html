<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Smash the Tables</title><meta name="description" content="Smash the Tables: a fan-made six-level tailgate jumping game."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>[hidden]{display:none!important}</style></head><body>

<style>
/* Layout: a one-screen arcade cabinet. HUD bar, wide stage with the scene, one big button underneath. Single dark look on purpose. */
:root{--night:#0a1630;--panel:#12224c;--panel2:#1a2e63;--ink:#0b1b3a;--blue:#2a63e8;--red:#e0263f;--redDeep:#8a1226;--snow:#f4f8ff;--mute:#9db0da;--gold:#ffcf4a;--ok:#3bd477;--bad:#ff5468;
 --display:'Lilita One','Impact','Arial Black',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
html,body{height:auto;margin:0;background:var(--night);color:var(--snow);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 80% at 50% -10%,#16327a 0%,var(--night) 60%) fixed,var(--night);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
*{box-sizing:border-box}
#app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px;user-select:none;-webkit-user-select:none}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 #050c1d}
.hud .lvl{font:400 1.25rem/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.hud .lvl small{display:block;font:800 .72rem/1.2 var(--body);color:var(--mute);letter-spacing:.08em;margin-top:3px}
.pips{display:flex;gap:7px;justify-content:center;align-items:center}
.pip{width:16px;height:16px;border-radius:50%;border:3px solid var(--mute);background:transparent}
.pip.used{background:var(--bad);border-color:var(--bad)}.pip.now{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 3px rgba(255,207,74,.25)}
.hud .right{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.pen{font:800 .8rem var(--body);color:var(--bad);letter-spacing:.04em}
.score{font:400 1.7rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--gold)}
.score small{font:800 .65rem var(--body);color:var(--mute);display:block;letter-spacing:.1em;text-align:right}
.quit{font:800 .72rem var(--body);color:var(--mute);background:none;border:0;cursor:pointer;text-decoration:underline;padding:4px}
.quit:focus-visible,.btn:focus-visible,.hold:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#stage{position:relative;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#cfe6ff;box-shadow:0 5px 0 #050c1d}
.anim[hidden]{display:block!important;visibility:hidden;position:absolute;left:0;top:0;width:100%;height:0;overflow:hidden;pointer-events:none}
#stage.fin{min-height:max(500px,64vh)}
.final{gap:10px!important;padding:18px 22px!important}
.anim svg{display:block;width:100%;height:auto}
.banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:5;text-align:center;background:rgba(10,22,48,.92);border:3px solid var(--ink);border-radius:14px;padding:8px 22px 10px;pointer-events:none;animation:pop .28s ease-out;min-width:180px}
.banner .big{display:block;font:400 clamp(1.5rem,5vw,2.4rem)/1.05 var(--display);letter-spacing:.03em;color:var(--snow);text-transform:uppercase}
.banner .big.ok{color:var(--ok)}.banner .big.bad{color:var(--bad)}
.banner .pts{display:block;font:400 clamp(1.8rem,6vw,3rem)/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.banner small{display:block;font:800 .8rem var(--body);color:var(--mute);letter-spacing:.06em;margin-top:2px}
#banner.left{left:14px;transform:none;animation:popL .28s ease-out;min-width:0;padding:6px 16px 8px}
#banner.left .big{font-size:clamp(1.1rem,3.2vw,1.7rem)}#banner.left .pts{font-size:clamp(1.4rem,4vw,2.1rem)}
@keyframes popL{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.veil{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(7,14,32,.62);padding:16px;overflow:auto}
.card{margin:auto;background:var(--panel);border:4px solid var(--ink);border-radius:18px;padding:22px 26px;text-align:center;box-shadow:0 6px 0 #050c1d;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center}
.logo{font:400 clamp(2.3rem,min(9vw,11vh),4.6rem)/.92 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-shadow:0 4px 0 var(--ink)}
.logo span{display:block}.logo .a{color:var(--snow)}.logo .b{color:var(--red);-webkit-text-stroke:2px var(--ink)}
.fine{font:700 .72rem/1.35 var(--body);color:var(--mute);margin:0;text-wrap:balance}
.rot{display:none;font:800 .78rem var(--body);color:var(--gold)}
@media (max-width:640px) and (orientation:portrait){.rot{display:block}}
.btn,.hold{font:400 1.25rem/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--red);border:3px solid var(--ink);border-radius:14px;padding:16px 28px;cursor:pointer;box-shadow:0 6px 0 var(--redDeep);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .06s,box-shadow .06s}
.btn:active,.hold:active{transform:translateY(4px);box-shadow:0 2px 0 var(--redDeep)}
.btn.alt{background:var(--blue);box-shadow:0 6px 0 #14327d}
.btn.alt:active{box-shadow:0 2px 0 #14327d}
#ctl{display:grid;gap:8px;justify-items:center}
#ctl>*{grid-area:1/1}
#ctl .holdwrap{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
#ctl .hold{width:min(100%,520px);font-size:clamp(1rem,3.4vw,1.35rem);padding:18px 14px}
#ctl .acts{display:flex;gap:12px;width:min(100%,520px);align-self:start}
#ctl .act{flex:1;min-width:0;font-size:clamp(1.1rem,3.6vw,1.5rem);padding:18px 14px;align-self:start}
.ghost{visibility:hidden}
.meter{min-height:18px;display:flex;justify-content:center;align-items:center;font-size:0}
.final h2{margin:0;font:400 1.1rem var(--display);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.final .total{font:400 clamp(3rem,13vw,5.5rem)/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.final .total small{font-size:.38em;color:var(--mute)}
.rank{font:400 1.35rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;width:100%}
.chip{background:var(--panel2);border:2px solid var(--ink);border-radius:10px;padding:6px 2px;font:800 .66rem var(--body);color:var(--mute);letter-spacing:.06em}
.chip b{display:block;font:400 1.15rem var(--display);color:var(--snow);font-variant-numeric:tabular-nums;letter-spacing:0}
.chip.miss b{color:var(--mute)}
@media (prefers-reduced-motion:reduce){.banner{animation:none}.btn,.hold{transition:none}}
</style>
<div id="app">
 <header class="hud" id="hud" hidden>
  <div class="lvl" id="hLevel"></div>
  <div class="pips" id="hPips" aria-label="Attempts"></div>
  <div class="right"><span class="pen" id="hPen"></span><div class="score" id="hScore">0<small>SCORE</small></div><button class="quit" id="quit" type="button">End run</button></div>
 </header>
 <div id="stage" class="fin">
  <div class="anim" id="tbl"></div><div class="anim" id="L2tbl" hidden></div><div class="anim" id="L3tbl" hidden></div><div class="anim" id="L4tbl" hidden></div><div class="anim" id="L5tbl" hidden></div><div class="anim" id="L6tbl" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <div class="veil" id="title">
   <div class="card">
    <h1 class="logo"><span class="a">Smash the</span><span class="b">Tables</span></h1>
    <button class="btn" id="play" type="button">Play</button>
    <p class="rot">Rotate your phone sideways for a bigger view.</p>
    <p class="fine">Fan-made game. Not affiliated with the Buffalo Bills or the NFL.</p>
   </div>
  </div>
  <div class="veil" id="final" hidden>
   <div class="card final">
    <h2 id="fTitle">Final score</h2>
    <div class="total"><span id="fTotal">0</span> <small>/ 600</small></div>
    <div class="rank" id="fRank"></div>
    <div class="chips" id="fChips"></div>
    <button class="btn" id="again" type="button">Play again</button>
   </div>
  </div>
 </div>
 <div id="ctl" hidden>
  <div class="holdwrap" id="hw0"><button class="hold" id="thold" type="button"></button><div class="meter" id="tsteps"></div></div>
  <div class="holdwrap" id="hw1" hidden><button class="hold" id="L2thold" type="button"></button><div class="meter" id="L2tsteps"></div></div>
  <div class="holdwrap" id="hw2" hidden><button class="hold" id="L3thold" type="button"></button><div class="meter" id="L3tsteps"></div></div>
  <div class="holdwrap" id="hw3" hidden><button class="hold" id="L4thold" type="button"></button><div class="meter" id="L4tsteps"></div></div>
  <div class="holdwrap" id="hw4" hidden><button class="hold" id="L5thold" type="button"></button><div class="meter" id="L5tsteps"></div></div>
  <div class="holdwrap" id="hw5" hidden><button class="hold" id="L6thold" type="button"></button><div class="meter" id="L6tsteps"></div></div>
  <div class="acts" id="acts" hidden><button class="btn act" id="act" type="button"></button><button class="btn alt act" id="rty" type="button"></button></div>
 </div>
</div>
<script>
var C={ol:'#0b1b3a',blue:'#1747c4',red:'#d3203a',white:'#ffffff',skin:'#f0c08a',fur:'#8a7560',furDark:'#3b3028',furLight:'#a8957e',horn:'#fffaf0',hornShade:'#e3d8c0',boot:'#101828',sw:4,shirt:'#f6f8ff',shirtShade:'#d5dbea',strap:'#3b78f0',strapTxt:'#d3203a',buckle:'#c9ced8'};
/* Body lengths (px). Change these to make him taller, shorter, longer-legged, etc. */
var B={thigh:33,shin:33,upper:25,fore:23,torso:56,head:.68,legW:18,armW:12,torsoW:34};
function defs(id){
 /* dense zigzag zebra stripes: white stripe with red edge on royal blue */
 var st='',i;
 for(i=0;i<6;i++){var y=i*8;
  st+='<path d="M-4 '+(y+6)+'L8 '+(y+1)+'L20 '+(y+6)+'L32 '+(y+1)+'L44 '+(y+6)+'" fill="none" stroke="'+C.red+'" stroke-width="3.6" stroke-linejoin="miter"/>';
  st+='<path d="M-4 '+(y+6)+'L8 '+(y+1)+'L20 '+(y+6)+'L32 '+(y+1)+'L44 '+(y+6)+'" fill="none" stroke="'+C.white+'" stroke-width="1.7" stroke-linejoin="miter"/>';
 }
 return '<defs><pattern id="z'+id+'" width="40" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(-8) scale(.8)"><rect width="40" height="48" fill="'+C.blue+'"/>'+st+'</pattern></defs>';
}
function V(a,l){a=a*Math.PI/180;return[Math.sin(a)*l,Math.cos(a)*l];}
function add(p,q){return[p[0]+q[0],p[1]+q[1]];}
function headSVG(p){var s='';
 /* ear flaps (behind face): long trapper flaps */
 [-1,1].forEach(function(k){
  s+='<path d="M'+(k*20)+' -14C'+(k*34)+' -14 '+(k*40)+' 0 '+(k*40)+' 20L'+(k*37)+' 36C'+(k*36)+' 44 '+(k*24)+' 44 '+(k*22)+' 36L'+(k*19)+' 12Z" fill="'+C.fur+'" stroke="'+C.ol+'" stroke-width="'+C.sw+'" stroke-linejoin="round"/>';
  s+='<path d="M'+(k*29)+' 6l'+(k*3)+' 8m'+(k*-8)+' 6l'+(k*4)+' 9m'+(k*-1)+' 8l'+(k*3)+' 8m'+(k*-9)+' -4l'+(k*2)+' 8" stroke="'+C.furDark+'" stroke-width="3" stroke-linecap="round" fill="none"/>';
 });
 /* face */
 s+='<circle cx="0" cy="2" r="24" fill="'+C.skin+'" stroke="'+C.ol+'" stroke-width="'+C.sw+'"/>';
 if(C.beard)s+='<path d="M-23 8Q-20 36 0 38Q20 36 23 8Q12 20 0 20Q-12 20 -23 8Z" fill="'+C.beard+'" stroke="'+C.ol+'" stroke-width="3" stroke-linejoin="round"/>';
 s+='<circle cx="-9" cy="8" r="3.6" fill="#1a1a1a"/><circle cx="9" cy="8" r="3.6" fill="#1a1a1a"/>';
 if(p.sad)s+='<path d="M-8 24Q0 15 8 24" fill="none" stroke="'+C.ol+'" stroke-width="3" stroke-linecap="round"/><path d="M-15 3L-5 -2M15 3L5 -2" stroke="'+C.ol+'" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="-14" cy="-6" rx="7" ry="4" fill="#2b2f3a" opacity=".55"/><ellipse cx="13" cy="20" rx="6" ry="4" fill="#2b2f3a" opacity=".5"/><path d="M-9 13Q-10 20 -8 24" stroke="#5db7ff" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
 else s+=p.mouth?'<ellipse cx="0" cy="19" rx="6" ry="7.5" fill="#7a1020" stroke="'+C.ol+'" stroke-width="2.5"/>':'<path d="M-8 17Q0 24 8 17" fill="none" stroke="'+C.ol+'" stroke-width="3" stroke-linecap="round"/>';
 s+='<circle cx="-16" cy="15" r="4" fill="#f08a7a" opacity=".6"/><circle cx="16" cy="15" r="4" fill="#f08a7a" opacity=".6"/>';
 /* horns (rise from the sides of the crown) */
 [-1,1].forEach(function(k){
  s+='<g transform="translate('+(k*26)+' -26) scale('+k+' 1)"><path d="M-4 6C8 6 18 0 22 -14C24 -24 20 -32 14 -38C16 -26 10 -16 -4 -14Z" fill="'+C.horn+'" stroke="'+C.ol+'" stroke-width="'+C.sw+'" stroke-linejoin="round"/><path d="M6 -4C12 -8 17 -16 17 -26" fill="none" stroke="'+C.hornShade+'" stroke-width="3" stroke-linecap="round"/></g>';
 });
 /* fur crown */
 s+='<path d="M-32 -12C-36 -36 -18 -44 0 -44C18 -44 36 -36 32 -12Z" fill="'+C.fur+'" stroke="'+C.ol+'" stroke-width="'+C.sw+'" stroke-linejoin="round"/>';
 /* turned-up fur brim: one smooth rounded band, like a trapper hat */
 s+='<path d="M-35 -24C-38 -14 -35 -5 -27 -3C-10 2 10 2 27 -3C35 -5 38 -14 35 -24C20 -32 -20 -32 -35 -24Z" fill="'+C.furLight+'" stroke="'+C.ol+'" stroke-width="'+C.sw+'" stroke-linejoin="round"/>';
 s+='<path d="M-26 -22l2 9m8 -11l1 11m9 -11l1 11m9 -11l0 11m9 -11l-1 11m9 -10l-2 10M-22 -34l3 6m9 -7l2 6m9 -6l1 6m9 -6l-1 6" stroke="'+C.furDark+'" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".75"/>';
 
 return s;}
/* Pose: t=torso lean (deg, + forward), n=neck tilt, la/le=back arm shoulder & elbow, ra/re=front arm, ll/lk=back leg hip & knee, rl/rk=front leg, mouth */
function legPts(h,a,k){var kn=add(h,V(a,B.thigh));return[kn,add(kn,V(a-k,B.shin))];}
function groundOffset(P){var h=[0,0],a=legPts(h,P.ll,P.lk)[1],b=legPts(h,P.rl,P.rk)[1];return -(Math.max(a[1],b[1])+8);}
function path(pts){return'M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join('L');}
function limb(pts,w,fill){var d=path(pts);return'<path d="'+d+'" fill="none" stroke="'+C.ol+'" stroke-width="'+(w+C.sw*2)+'" stroke-linecap="round" stroke-linejoin="round"/><path d="'+d+'" fill="none" stroke="'+fill+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';}
function rig(id,P,skel,theme){
 var plain=!!(theme&&theme.plain),Z=plain?theme.pants:'url(#z'+id+')',SH=plain?theme.shirt:C.shirt,h=[0,0],s='';
 var sh=add(h,[Math.sin(P.t*Math.PI/180)*B.torso,-Math.cos(P.t*Math.PI/180)*B.torso]);
 function arm(a,e){var el=add(sh,V(a,B.upper)),w=add(el,V(a+e,B.fore));return[el,w];}
 var la=arm(P.la,P.le),ra=arm(P.ra,P.re),ll=legPts(h,P.ll,P.lk),rl=legPts(h,P.rl,P.rk);
 function boot(an,sa){return'<g transform="translate('+an[0].toFixed(1)+' '+an[1].toFixed(1)+') rotate('+(-sa)+')"><rect x="-7" y="-3" width="25" height="11" rx="5" fill="'+C.boot+'" stroke="'+C.ol+'" stroke-width="'+C.sw+'"/></g>';}
 function hand(w){return'<circle cx="'+w[0].toFixed(1)+'" cy="'+w[1].toFixed(1)+'" r="7" fill="'+C.skin+'" stroke="'+C.ol+'" stroke-width="'+C.sw+'"/>';}
 /* back limbs */
 s+=limb([sh,la[0],la[1]],B.armW,SH)+hand(la[1]);
 s+=limb([h,ll[0],ll[1]],B.legW,Z)+boot(ll[1],P.ll-P.lk);
 /* torso */

 var tr=P.t*Math.PI/180,ux=Math.sin(tr),uy=-Math.cos(tr),px=Math.cos(tr),py=Math.sin(tr);
 function at(f,o){return[ux*B.torso*f+px*o,uy*B.torso*f+py*o];}
 /* white long-sleeve shirt underneath */
 s+=limb([h,sh],B.torsoW,SH);
 if(!plain){
 /* back strap */
 var bt=0.66;
 function strap(o1,o2){var p1=at(bt,o1),p2=at(0.98,o2);return limb([p1,p2],5,C.strap);}
 s+=strap(-11,-10);
 /* overall bib */
 var q=[at(0,-17),at(bt,-14),at(bt,14),at(0,17)];
 s+='<path d="'+path(q)+'Z" fill="'+Z+'" stroke="'+C.ol+'" stroke-width="'+C.sw+'" stroke-linejoin="round"/>';
 s+='<circle cx="'+h[0]+'" cy="'+h[1]+'" r="'+(B.torsoW/2+2)+'" fill="'+Z+'" stroke="'+C.ol+'" stroke-width="'+C.sw+'"/>';
 s+='<path d="'+path([at(0.14,-9),at(0.14,9),at(0.4,9),at(0.4,-9)])+'Z" fill="none" stroke="'+C.ol+'" stroke-width="2" opacity=".55" stroke-linejoin="round"/>';
 /* front strap, buckle and tag */
 s+=strap(11,10);
 var bk=at(bt,11);
 s+='<g transform="translate('+bk[0].toFixed(1)+' '+bk[1].toFixed(1)+') rotate('+P.t+')"><rect x="-4.5" y="-4.5" width="9" height="9" rx="2" fill="'+C.buckle+'" stroke="'+C.ol+'" stroke-width="2.4"/></g>';
 var tg=at(bt-0.02,0);
 s+='<g transform="translate('+tg[0].toFixed(1)+' '+tg[1].toFixed(1)+') rotate('+P.t+')"><rect x="-6" y="-1.5" width="12" height="5" rx="1" fill="'+C.shirt+'" stroke="'+C.ol+'" stroke-width="1.6"/></g>';
 }
 /* front leg */
 s+=limb([h,rl[0],rl[1]],B.legW,Z)+boot(rl[1],P.rl-P.rk);
 /* head */
 var tn=P.t+(P.n||0),hc=add(sh,[Math.sin(tn*Math.PI/180)*(15+B.head*24),-Math.cos(tn*Math.PI/180)*(15+B.head*24)]);
 s+='<g transform="translate('+hc[0].toFixed(1)+' '+hc[1].toFixed(1)+') rotate('+tn+') scale('+B.head+')">'+headSVG(P)+'</g>';
 /* front arm */
 s+=limb([sh,ra[0],ra[1]],B.armW,SH)+hand(ra[1]);
 if(skel){[h,sh,la[0],la[1],ra[0],ra[1],ll[0],ll[1],rl[0],rl[1]].forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="#ffd23f" stroke="#000" stroke-width="1"/>';});}
 return s;
}
var POSE={
 ready:{t:0,n:0,la:235,le:-8,ra:125,re:8,ll:5,lk:4,rl:-5,rk:5,mouth:true},
 crouch:{t:32,n:-14,la:-65,le:12,ra:-50,re:15,ll:62,lk:110,rl:48,rk:100},
 launch:{t:8,n:-6,la:225,le:-6,ra:128,re:8,ll:8,lk:4,rl:-8,rk:12,mouth:true},
 tuck:{t:34,n:-18,la:100,le:35,ra:80,re:40,ll:92,lk:105,rl:70,rk:95,mouth:true},
 dive:{t:78,n:-30,la:140,le:10,ra:128,re:8,ll:-22,lk:12,rl:-35,rk:6,mouth:true},
 land:{t:84,n:-26,la:120,le:22,ra:100,re:30,ll:-12,lk:22,rl:-38,rk:12,mouth:true}
};
function defsFor(id){return defs(id);}
function rigT(id,P,theme){var o={skin:C.skin,beard:C.beard};if(theme){C.skin=theme.skin;C.beard=theme.beard;}var out=rig(id,P,false,theme);C.skin=o.skin;C.beard=o.beard;return out;}
function mix(a,b,k){var o={};for(var key in a){if(typeof a[key]==='number')o[key]=a[key]+(b[key]-a[key])*k;else o[key]=k<.5?a[key]:b[key];}return o;}
/* ---------- front view ---------- */
function frontFan(id,P){

  var dots='';for(var i=1;i<=3;i++)dots+='<span style="display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:4px;background:'+(st>=i?'#d3203a':'#cfd7ea')+'"></span>';
  var hv=((T.mode==='run'||T.mode==='turn')&&!POT&&!BUS?dots+msg:msg);if(hv!==LHV){stp.innerHTML=hv;LHV=hv;}
  var lab=(LEVEL===2&&(T.mode==='tower'||T.mode==='squat'))?'HOLD to squat, RELEASE to throw':(POT||BUS)?'HOLD to charge the jump, RELEASE to leap':(LEVEL===4)?(T.mode==='air'?'PRESS to catch!':(T.mode==='idle'||T.mode==='done'||T.mode==='hit')?'PRESS and HOLD to run. RELEASE to jump. PRESS again to catch.':'RELEASE to jump'):'HOLD to run, RELEASE to jump';if(hold.textContent!==lab)hold.textContent=lab;
 }
 var VIS=true;
 if(window.IntersectionObserver&&el&&el.nodeType){try{new IntersectionObserver(function(en){VIS=en[en.length-1].isIntersecting;}).observe(el);}catch(x){}}
 function loop(now){
  if(!VIS){last=now;requestAnimationFrame(loop);return;}
  if(CAPMS&&now-LREN<CAPMS){requestAnimationFrame(loop);return;}LREN=now;
  var rdt=Math.min(.04,(now-last)/1000);clk+=rdt;var dt=rdt*(slow.checked?.3:1);last=now;
  if(!window.__freeze)step(dt);render();hud();
  if(RM&&T.mode==='done'&&T.tm>4.2){running=false;return;}
  requestAnimationFrame(loop);
 }
reset();render();
 if(LEVEL===4){
  var adv=function(t){var n=Math.round(t*120);for(var i=0;i<n;i++){clk+=1/120;step(1/120);}};
  window.__ctl4={adv:adv,down:function(){startRun();},up:function(){releaseRun();},reset:function(){reset();}};
  window.__sim4=function(h,gap){reset();startRun();adv(h);releaseRun();var pred=T.pred&&{t:+T.pred.tI.toFixed(2),d:Math.round(T.pred.d)};if(gap!==null){adv(gap);startRun();}adv(6);return{r:T.result,c:T.caught,xi:Math.round(T.xi||0),f:T.full,m:T.mode,p:pred};};
 }
 if(POT){
  var adv5=function(t){var n=Math.round(t*120);for(var i=0;i<n;i++){clk+=1/120;step(1/120);}};
  window.__ctl5={adv:adv5,down:function(){startRun();},up:function(){releaseRun();},reset:function(){reset();}};
  window.__sim5=function(h){reset();startRun();adv5(h);releaseRun();var A=T.air,pre=A?{tip:!!A.tip,will:!!A.will,vx:Math.round(A.vx)}:{};adv5(7);return{th:+(T.th||0).toFixed(3),tip:T.tip,full:T.full,miss:T.miss,xi:Math.round(T.xi||0),k:T.b&&T.b.kind,m:T.mode,pre:pre};};
 }
 if(BUS){
  var adv6=function(t){var n=Math.round(t*120);for(var i=0;i<n;i++){clk+=1/120;step(1/120);}};
  window.__ctl6={adv:adv6,down:function(){startRun();},up:function(){releaseRun();},reset:function(){reset();}};
  window.__sim6=function(h){reset();startRun();adv6(h);releaseRun();adv6(8);return{sq:+(T.th-1).toFixed(3),full:T.full,xi:Math.round(T.xi||0),k:T.b&&T.b.kind,m:T.mode,cl:+T.cl.toFixed(1)};};
 }
 TOL=window.PASS_FT;
 hold.addEventListener('pointerdown',function(e){ACTIVE=PX;e.preventDefault();try{hold.setPointerCapture(e.pointerId);}catch(x){}startRun();});
 ['pointerup','pointercancel','lostpointercapture'].forEach(function(n){hold.addEventListener(n,function(){releaseRun();});});
 el.addEventListener('pointerenter',function(){ACTIVE=PX;});
 document.addEventListener('keydown',function(e){if(ACTIVE===PX&&e.code==='Space'&&!e.repeat&&e.target&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&Q('tbl').getBoundingClientRect().bottom>0){e.preventDefault();startRun();}});
 document.addEventListener('keyup',function(e){if(ACTIVE===PX&&e.code==='Space')releaseRun();});
 slider.addEventListener('input',function(){Q('toffv').textContent=fmt(+slider.value);});
 Q('tdrop').addEventListener('click',function(){drop(+slider.value);});
 [['tc',0],['t6',.5],['t1',1.2],['t2',2.2],['t4',3.6],['tm',6.5]].forEach(function(p){Q(p[0]).addEventListener('click',function(){slider.value=p[1];Q('toffv').textContent=fmt(p[1]);drop(p[1]);});});
 Q('toffv').textContent=fmt(0);
 if(!RM){running=true;last=performance.now();requestAnimationFrame(loop);}
 return{state:function(){return T;},resetScene:function(){reset();render();},adv:function(t){var n=Math.round(t*120);for(var i=0;i<n;i++){clk+=1/120;step(1/120);}},startRun:startRun,releaseRun:releaseRun};
}

var ACTIVE='';
/* ---------------- game rules: change numbers here ---------------- */
var CFG={PASS_FT:1.0,PENALTY:5,MAX_ATTEMPTS:5,BASE_AT_EDGE:70,PERFECT_FT:.25};
window.PASS_FT=CFG.PASS_FT;
var LV=[{px:'',n:'LFG!!!'},{px:'L2',n:'Send It'},{px:'L3',n:'Higher Ground'},{px:'L4',n:'Go Long'},{px:'L5',n:'Porta Smash'},{px:'L6',n:'The Short Bus'}];
var SC=LV.map(function(l,i){return makeScene(l.px,i+1);});
var $=function(i){return document.getElementById(i);};
var run={st:'title',lv:0,att:1,fails:0,scores:[],total:0,ev:false,over:false,pass:false};
var introTok=0;
function hudUpdate(){
 $('hLevel').innerHTML='Level '+(run.lv+1)+' / '+LV.length+'<small>'+LV[run.lv].n+'</small>';
 var p='';for(var i=1;i<=CFG.MAX_ATTEMPTS;i++)p+='<span class="pip '+(i<run.att?'used':(i===run.att?'now':''))+'"></span>';
 $('hPips').innerHTML=p;
 $('hPen').textContent=run.fails?('-'+(run.fails*CFG.PENALTY)+' this round'):'';
 $('hScore').innerHTML=run.total+'<small>SCORE</small>';
}
function showLevel(i){
 run.lv=i;
 LV.forEach(function(l,j){$(l.px+'tbl').hidden=(j!==i);$('hw'+j).hidden=(j!==i);});
 ACTIVE=LV[i].px;SC[i].resetScene();
 $('acts').hidden=true;$('hw'+i).classList.remove('ghost');
 hudUpdate();
 var tok=++introTok;banner('<b class="big">Level '+(i+1)+'</b><small>'+LV[i].n+'</small>');
 setTimeout(function(){if(tok===introTok&&!run.ev)$('banner').hidden=true;},1500);
}
function banner(h,left){var b=$('banner');b.hidden=true;b.className=left?'banner left':'banner';b.innerHTML=h;void b.offsetWidth;b.hidden=false;}
function newRun(){
 run={st:'play',lv:0,att:1,fails:0,scores:[],total:0,ev:false,over:false,pass:false};
 $('title').hidden=true;$('final').hidden=true;$('stage').classList.remove('fin');$('hud').hidden=false;$('ctl').hidden=false;
 showLevel(0);
}
function evaluate(T){
 run.ev=true;run.st='result';
 var pass=!!(T.full&&!T.miss),d=Math.abs(T.xi)/30.5;
 var cur=$('hw'+run.lv);cur.classList.add('ghost');
 introTok++;
 if(pass){
  var base=d<=CFG.PERFECT_FT?100:Math.round(100-(100-CFG.BASE_AT_EDGE)*Math.min(1,(d-CFG.PERFECT_FT)/(CFG.PASS_FT-CFG.PERFECT_FT)))   /* within PERFECT_FT (3 in) = full 100 */,pen=run.fails*CFG.PENALTY,sc=Math.max(0,base-pen);
  run.scores[run.lv]=sc;run.total+=sc;run.pass=true;
  banner('<b class="big ok">'+(base>=100?'Perfect!':base>=90?'Excellent!':base>=80?'Great!':'Good!')+'</b><span class="pts">+'+sc+'</span>'+(pen?'<small>'+base+' - '+pen+' penalty</small>':''),run.lv===LV.length-1);
 }else{
  run.pass=false;run.fails++;run.att++;
  var left=CFG.MAX_ATTEMPTS-run.att+1;
  run.over=left<=0;
  banner('<b class="big bad">'+(run.over?'Game over':'Missed')+'</b>'+(run.over?'':'<small>'+left+(left===1?' attempt left':' attempts left')+'</small>'));
 }
 hudUpdate();
}
function actLabel(){return run.pass?(run.lv===LV.length-1?'Final score':'Next level'):(run.over?'Final score':'Try again');}
function showFinal(quit){
 run.st='final';introTok++;
 $('banner').hidden=true;$('acts').hidden=true;
 var t=run.total,cleared=run.scores.filter(function(x){return x!==undefined;}).length;
 $('fTitle').textContent=cleared===LV.length?'All six levels cleared':(quit?'Run ended':'Out of attempts');
 $('fTotal').textContent=t;
 var r=t>=540?'Table Smashing Legend':t>=420?'Mafia Menace':t>=300?'Tailgate Regular':t>=150?'Rookie Smasher':'Table Survivor';
 $('fRank').textContent=r;
 var c='';LV.forEach(function(l,i){var s=run.scores[i];c+='<div class="chip'+(s===undefined?' miss':'')+'">L'+(i+1)+'<b>'+(s===undefined?'-':s)+'</b></div>';});
 $('fChips').innerHTML=c;
 $('final').hidden=false;$('stage').classList.add('fin');$('ctl').hidden=true;
}
$('play').addEventListener('click',newRun);
$('again').addEventListener('click',newRun);
$('quit').addEventListener('click',function(){if(run.st==='play'||run.st==='result')showFinal(true);});
$('rty').addEventListener('click',function(){
 if(run.st!=='result'||!run.pass||run.att>=CFG.MAX_ATTEMPTS)return;
 run.total-=run.scores[run.lv];run.scores[run.lv]=undefined;
 run.fails++;run.att++;run.pass=false;run.ev=false;run.st='play';
 $('banner').hidden=true;$('acts').hidden=true;$('hw'+run.lv).classList.remove('ghost');SC[run.lv].resetScene();hudUpdate();
});
$('act').addEventListener('click',function(){
 if(run.st!=='result')return;
 if(run.pass){
  if(run.lv===LV.length-1){showFinal(false);return;}
  run.att=1;run.fails=0;run.ev=false;run.st='play';showLevel(run.lv+1);   /* each round starts fresh: its penalty never carries over */
 }else if(run.over){showFinal(false);}
 else{run.ev=false;run.st='play';$('banner').hidden=true;$('acts').hidden=true;$('hw'+run.lv).classList.remove('ghost');SC[run.lv].resetScene();hudUpdate();}
});
/* keep the space bar from starting a jump unless a round is live */
document.addEventListener('keydown',function(e){if(e.code==='Space'&&run.st!=='play'){e.stopImmediatePropagation();if(e.target&&e.target.tagName!=='BUTTON')e.preventDefault();}},true);
(function poll(){
 if(run.st==='play'||run.st==='result'){
  var T=SC[run.lv].state();
  if(run.st==='play'&&!run.ev&&(T.mode==='hit'||T.mode==='done')&&T.tm>.05)evaluate(T);
  if(run.st==='result'&&$('acts').hidden&&T.mode==='done'){$('act').textContent=actLabel();var rb=$('rty');rb.hidden=!(run.pass&&run.att<CFG.MAX_ATTEMPTS);rb.textContent='Retry (-'+CFG.PENALTY+')';$('acts').hidden=false;}
 }
 requestAnimationFrame(poll);
})();
SC[0].resetScene();
window.__game={run:run,SC:SC,CFG:CFG,get:function(){return run;}};
</script>
